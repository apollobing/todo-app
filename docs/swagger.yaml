        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_apollobing_todo-app_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_apollobing_todo-app_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_apollobing_todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_apollobing_todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Update user
      tags:
