          description: User deleted successfully
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_apollobing_todo-app_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_apollobing_todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_apollobing_todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Delete user
      tags:
      - users
    get:
      description: Get a specific user by ID
      parameters:
      - description: ID of the user to retrieve
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User retrieved successfully
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.GetUserResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_apollobing_todo-app_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_apollobing_todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_apollobing_todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Get user
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        Update information of an existing user in the system
        ### Field update logic (Three-state logic):
        1. **Field omitted**: `phone_number` is ignored, DB value remains unchanged
        2. **Explicit value provided**: `"phone_number": "+491234567890"` - sets the new phone number in the DB
        3. **null provided**: `"phone_number": null` - clears the field in the DB (set to NULL)
        Constraints: `full_name` cannot be set to null
      parameters:
      - description: ID of the user to update
        in: path
        name: id
        required: true
        type: integer
      - description: PatchUser request body
        in: body
        name: request
        required: true
        schema:
